<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Free Practice Check</title>
<style>
:root { --navy:#1B2A4A; --amber:#D4782A; --white:#F7F3ED; --ink:#1f2430; --muted:#5b6475; --line:#d9d2c5; }
* { box-sizing: border-box; }
body { margin:0; background:var(--white); color:var(--ink); font:16px/1.55 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
header { background:var(--navy); color:var(--white); padding:28px 16px; }
header .wrap, main { max-width:760px; margin:0 auto; }
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight:normal; }
h1 { margin:0 0 6px; font-size:30px; }
header p { margin:4px 0; }
.question { color:#f0c9a3; font-size:18px; }
main { padding:24px 16px 48px; }
ol#statements { list-style:none; padding:0; margin:0; counter-reset:s; }
.statement { counter-increment:s; background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin:0 0 12px; }
.statement-text { margin:0 0 10px; }
.statement-text::before { content: counter(s) ". "; color:var(--amber); font-weight:600; }
.choices { display:flex; flex-wrap:wrap; gap:8px; }
.choice { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
.choice:has(input:checked) { border-color:var(--navy); background:#e9edf5; }
.actions { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:20px 0; }
#progress { color:var(--muted); }
button { font:inherit; border:0; border-radius:6px; padding:10px 18px; cursor:pointer; background:var(--amber); color:#fff; }
button:disabled { background:#c9c2b6; cursor:not-allowed; }
#result { border-top:3px solid var(--navy); margin-top:24px; padding-top:8px; }
.block { margin:18px 0; }
.block h2 { color:var(--navy); margin:0 0 8px; font-size:22px; }
.tier { font-size:20px; margin:0 0 4px; }
.tier strong { color:var(--amber); }
.domain-row { display:grid; grid-template-columns: 1fr auto; gap:4px 12px; padding:8px 0; border-bottom:1px solid var(--line); }
.domain-name { font-weight:600; }
.bar { display:flex; gap:3px; align-self:center; }
.seg { width:36px; height:10px; border-radius:2px; background:#e3ddd2; }
.seg.on { background:var(--navy); }
.domain-label { grid-column:1 / -1; color:var(--muted); font-size:14px; }
.source { color:var(--muted); font-size:14px; }
.source a { color:var(--navy); }
.decision { font-weight:600; }
.count-text { font-weight:600; }
.count { counter-increment:none; }
.count-text::before { content:none; }
.neutral { font-weight:600; color:var(--navy); }
#top-peers { margin-top:14px; border-top:1px solid #34456b; padding-top:10px; }
#top-peers .peer { font-size:15px; margin:6px 0; }
#top-peers .source, #top-peers .source a { color:#c9d1e0; }
.answer-prompt { font-weight:600; margin:18px 0 10px; }
.placement { margin:-4px 0 12px; font-weight:600; color:var(--navy); }
.contact { counter-increment:none; }
.contact h2 { color:var(--navy); margin:0 0 10px; font-size:20px; }
.contact-fields { display:grid; grid-template-columns: 1fr 1fr; gap:10px 12px; }
.contact-fields label { display:flex; flex-direction:column; font-size:14px; color:var(--muted); gap:4px; }
.contact-fields input { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; color:var(--ink); }
@media (max-width:520px) { .contact-fields { grid-template-columns: 1fr; } }
.save-error { color:#9b2c1c; font-weight:600; }
.subscribe ul { padding-left:20px; }
.subscribe li { margin:6px 0; }
.subscribe a { color:var(--navy); }
footer { color:var(--muted); font-size:13px; max-width:760px; margin:0 auto; padding:0 16px 32px; }
@media print {
  header { background:none; color:var(--ink); padding:0 0 8px; border-bottom:2px solid var(--navy); }
  .question { color:var(--muted); }
  #top-peers .source, #top-peers .source a { color:var(--muted); }
  #questions, .actions, button.print { display:none !important; }
  #result { border-top:0; }
  .seg { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="tool-name"></h1>
  <p class="question" id="tool-question"></p>
  <p id="tool-intro"></p>
  <div id="top-peers"></div>
</div></header>
<main>
  <section id="questions">
    <div id="count" class="statement count"></div>
    <div id="task" class="statement count"></div>
    <p id="answer-prompt" class="answer-prompt"></p>
    <ol id="statements"></ol>
    <section id="contact" class="statement contact">
      <h2 id="contact-heading"></h2>
      <div id="contact-fields" class="contact-fields"></div>
      <p id="contact-privacy" class="source"></p>
    </section>
    <div class="actions">
      <button id="see-result" type="button" disabled>See my result</button>
      <span id="progress"></span>
    </div>
  </section>
  <section id="result" hidden></section>
</main>
<footer>Beacon IT Advisory · This page saves your answers, your result and your contact details so Beacon can follow up. It asks for no patient information.</footer>
<script>window.FREE_TOOL_DATA = {"bank":{"domains":[{"key":"governance","name":"Governance and risk","maps_to":["D7"],"benchmark":"mgma_ai_policy"},{"key":"workflow","name":"Workflow fit","maps_to":["D5"],"benchmark":"mgma_role_redesign"},{"key":"data","name":"Data and integration","maps_to":["D4","D5"],"benchmark":null},{"key":"people","name":"People and change","maps_to":["D6"],"benchmark":null},{"key":"buyer","name":"Proof of value","maps_to":["D8"],"benchmark":"mgma_work_shift"},{"key":"oversight","name":"Project oversight","maps_to":["D7"],"benchmark":null}],"questions":[{"id":"GOV-01","domain":"governance","maps_to":"D7","anchor":"L3","step":"free","version":5,"text":"Each AI tool is named in a written AI use policy.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-05","domain":"governance","maps_to":"D7","anchor":"L3","step":"free","version":2,"text":"Each AI vendor whose tool touches patient information signed a business associate agreement (BAA) with your practice.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-02","domain":"governance","maps_to":"D7","anchor":"L4","step":"free","version":3,"text":"A named person or group approved each AI tool before staff used it.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-03","domain":"governance","maps_to":"D7","anchor":"L3","step":"free","version":3,"text":"Each AI tool that staff use, free ones included, is on a written list that you updated in the last 6 months.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-04","domain":"governance","maps_to":"D7","anchor":"L4","step":"free","version":3,"text":"For each AI tool that writes to the chart or to a claim, a staff member reviews its output first.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-06","domain":"governance","maps_to":"D7","anchor":"L4","step":"free","version":2,"text":"Staff ask each patient before an AI tool records the visit.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-09","domain":"governance","maps_to":"D7","anchor":"L4","step":"free","version":1,"text":"You tell patients when AI drafts the messages they get.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-07","domain":"governance","maps_to":"D7","anchor":"L3","step":"free","version":2,"text":"Your AI tool list marks each tool as 'acts on its own' or 'drafts for staff'.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-08","domain":"governance","maps_to":"D7","anchor":"L4","step":"free","version":2,"text":"Each AI tool that acts on its own has written limits on what it may do without a person's approval.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"WRK-01","domain":"workflow","maps_to":"D5","anchor":"L3","step":"free","version":5,"text":"For each AI tool, you wrote down the 1 task it must improve and the result it must reach.","next_step":"For each tool, name its workflow and count that workflow's time or errors for 2 weeks."},{"id":"WRK-02","domain":"workflow","maps_to":"D5","anchor":"L4","step":"free","version":4,"text":"Before each AI tool started, you measured the time or error count of its task.","next_step":"For each tool, name its workflow and count that workflow's time or errors for 2 weeks."},{"id":"WRK-03","domain":"workflow","maps_to":"D5","anchor":"L4","step":"free","version":3,"text":"For each AI tool, you wrote down who does what differently now.","next_step":"For each tool, name its workflow and count that workflow's time or errors for 2 weeks."},{"id":"DAT-01","domain":"data","maps_to":"D4","anchor":"L3","step":"free","version":4,"text":"Each AI tool reads from your EHR without staff copying data by hand.","next_step":"Ask each vendor which EHR fields its tool reads and writes, and for a monthly use report."},{"id":"DAT-02","domain":"data","maps_to":"D5","anchor":"L4","step":"free","version":4,"text":"For each AI tool, you can get a monthly report of its work volume, such as notes drafted or calls handled.","next_step":"Ask each vendor which EHR fields its tool reads and writes, and for a monthly use report."},{"id":"DAT-03","domain":"data","maps_to":"D5","anchor":"L3","step":"free","version":3,"text":"You can see who uses each AI tool and how often.","next_step":"Ask each vendor which EHR fields its tool reads and writes, and for a monthly use report."},{"id":"PPL-01","domain":"people","maps_to":"D6","anchor":"L3","step":"free","version":4,"text":"More than half of the staff each AI tool was bought for use it each week.","next_step":"Count last week's users of each tool, check each patient-care tool for bias, and ask clinicians before the next purchase."},{"id":"PPL-04","domain":"people","maps_to":"D7","anchor":"L4","step":"free","version":2,"text":"For each AI tool that supports patient care decisions, you asked the vendor in writing whether it uses race, color, national origin, sex, age or disability as an input.","next_step":"Count last week's users of each tool, check each patient-care tool for bias, and ask clinicians before the next purchase.","group":"AI rules"},{"id":"PPL-03","domain":"people","maps_to":"D6","anchor":"L3","step":"free","version":3,"text":"For each AI tool that clinicians use, at least 1 of them tested it before the purchase.","next_step":"Count last week's users of each tool, check each patient-care tool for bias, and ask clinicians before the next purchase."},{"id":"BUY-01","domain":"buyer","maps_to":"D8","anchor":"L3","step":"free","version":4,"text":"For each AI tool, you have a written yearly cost that includes fees, add-ons and staff time.","next_step":"Add up each tool's yearly cost, set the dollar return it must reach, and set a keep-or-stop date. Put each tool on one project list with an owner and a go, hold or stop date."},{"id":"BUY-02","domain":"buyer","maps_to":"D8","anchor":"L4","step":"free","version":4,"text":"You compared each AI tool's cost with a measured return in dollars.","next_step":"Add up each tool's yearly cost, set the dollar return it must reach, and set a keep-or-stop date. Put each tool on one project list with an owner and a go, hold or stop date."},{"id":"BUY-03","domain":"buyer","maps_to":"D8","anchor":"L4","step":"free","version":3,"text":"You set a date to decide whether to keep or stop each AI tool.","next_step":"Add up each tool's yearly cost, set the dollar return it must reach, and set a keep-or-stop date. Put each tool on one project list with an owner and a go, hold or stop date."},{"id":"PMO-01","domain":"oversight","maps_to":"D7","anchor":"L3","step":"free","version":2,"text":"Each open AI or IT project is on 1 list with a named owner.","next_step":"List every open AI and IT project, name 1 owner for each, and review the list with your leaders once a month.","group":"Project oversight"},{"id":"PMO-02","domain":"oversight","maps_to":"D7"," ment","text":"Each provider's charges reach billing within 1 business day of the visit."},{"id":"SC-D2-02","maps_to":"D2","step":"scorecard","version":1,"kind":"statement","text":"You track the clean claim rate for each payer every month."},{"id":"SC-D2-03","maps_to":"D2","step":"scorecard","version":2,"kind":"statement","text":"You have a report from the last 12 months that shows each major payer's share of your revenue."},{"id":"SC-D2-04","maps_to":"D2","step":"scorecard","version":2,"kind":"statement","text":"Each billing step (charge entry, claims, payment posting, follow-up) has a written procedure."},{"id":"SC-D2-06","maps_to":"D2","step":"scorecard","version":1,"kind":"statement","text":"Staff check insurance eligibility for each scheduled visit before the visit date."},{"id":"SC-D2-07","maps_to":"D2","step":"scorecard","version":1,"kind":"statement","text":"Each prior authorization request is on a list with its send date and its answer date."},{"id":"SC-D2-05","maps_to":"D2","step":"scorecard","version":2,"kind":"poll","scored":false,"benchmark":"mgma_rcm_automation","text":"This year, your revenue cycle is moving toward:","find_out":"Find out which way your revenue cycle is moving this year: more automation, no change or more manual work.","options":[{"value":"auto","label":"More automation","place":"{REVISION NEEDED HERE}"},{"value":"same","label":"No major change","place":"{REVISION NEEDED HERE}"},{"value":"manual","label":"More manual work","place":"{REVISION NEEDED HERE}"},{"value":"notsure","label":"Not sure","place":"Find out which way your revenue cycle is moving to see where you stand."}]},{"id":"SC-D3-01","maps_to":"D3","step":"scorecard","version":1,"kind":"statement","text":"You log each denial with its payer and reason.","help":"If a billing company does this, answer for the company."},{"id":"SC-D3-02","maps_to":"D3","step":"scorecard","version":3,"kind":"statement","text":"Staff take a first action on each denial within 2 business days of receiving it.","help":"If a billing company does this, answer for the company. Source for 2 business days: HFMA, Ask the Expert: Rebilling Denials (2015, updated 2022)."},{"id":"SC-D3-03","maps_to":"D3","step":"scorecard","version":2,"kind":"statement","text":"Each of your top 5 denial reasons has a named person who works to prevent it.","help":"If a billing company does this, answer for the company."},{"id":"SC-D3-04","maps_to":"D3","step":"scorecard","version":2,"kind":"statement","text":"A second person audits a sample of the coding of each person who codes, at least once a year."},{"id":"SC-D3-05","maps_to":"D3","step":"scorecard","version":1,"kind":"poll","scored":false,"benchmark":"mgma_rcm_leak","text":"Where does your revenue cycle lose the most money?","find_out":"Find out where your revenue cycle loses the most money.","options":[{"value":"denials","label":"Denials and appeals","place":"{REVISION NEEDED HERE}"},{"value":"front","label":"Front end (registration and eligibility)","place":"{REVISION NEEDED HERE}"},{"value":"billing","label":"Billing and collections","place":"{REVISION NEEDED HERE}"},{"value":"coding","label":"Coding","place":"{REVISION NEEDED HERE}"},{"value":"posting","label":"Charge posting","place":"{REVISION NEEDED HERE}"},{"value":"notsure","label":"Not sure","place":"Find out where your revenue cycle loses the most money to see where you stand."}]},{"id":"SC-D4-01","maps_to":"D4","step":"scorecard","version":2,"kind":"statement","text":"Each report you run every month comes from the EHR or practice management system with no rework in a spreadsheet."},{"id":"SC-D4-02","maps_to":"D4","step":"scorecard","version":2,"kind":"statement","text":"Each system that holds patient information is in a security risk analysis from the last 12 months."},{"id":"SC-D4-03","maps_to":"D4","step":"scorecard","version":1,"kind":"statement","text":"Each outside result you rely on, such as labs, arrives in the EHR by interface."},{"id":"SC-D4-04","maps_to":"D4","st "date":"Feb 10, 2026","n":177,"url":"{REVISION NEEDED HERE}"},"mgma_self_schedule":{"line":"{REVISION NEEDED HERE}","source":"{REVISION NEEDED HERE}","date":"Jul 29, 2025","n":244,"url":"{REVISION NEEDED HERE}","stat_id":"S0192"},"mgma_portal_cover":{"line":"{REVISION NEEDED HERE}","source":"{REVISION NEEDED HERE}","date":"Oct 27, 2026","n":238,"url":"{REVISION NEEDED HERE}","stat_id":"S0252"},"mgma_rcm_automation":{"line":"{REVISION NEEDED HERE}","source":"{REVISION NEEDED HERE}","date":"Oct 20, 2026","n":214,"url":"{REVISION NEEDED HERE}","stat_id":"S0251"},"mgma_ai_coding":{"line":"{REVISION NEEDED HERE}","source":"{REVISION NEEDED HERE}","date":"Apr 7, 2026","n":256,"url":"{REVISION NEEDED HERE}","stat_id":"S0225"},"mgma_rcm_leak":{"line":"{REVISION NEEDED HERE}","source":"{REVISION NEEDED HERE}","date":"Jan 6, 2026","n":288,"url":"{REVISION NEEDED HERE}","stat_id":"S0213"},"mgma_prior_auth":{"line":"Medicare Advantage insurers fully or partly denied 7.7% of prior authorization requests in 2024 (4.1 million of about 53 million).","source":"KFF","date":"2024 data","n":null,"url":"https://www.kff.org/medicare/medicare-advantage-insurers-made-nearly-53-million-prior-authorization-determinations-in-2024/"},"mgma_workarounds":{"line":"{REVISION NEEDED HERE}","source":"{REVISION NEEDED HERE}","date":"Jul 21, 2026","n":216,"url":"{REVISION NEEDED HERE}","stat_id":"S0240"},"mgma_cyber":{"line":"{REVISION NEEDED HERE}","source":"{REVISION NEEDED HERE}","date":"Oct 6, 2026","n":238,"url":"{REVISION NEEDED HERE}","stat_id":"S0249"},"mgma_turnover":{"line":"In health care and social assistance, 2.0% of workers quit their jobs in September 2026 (preliminary, seasonally adjusted).","source":"U.S. Bureau of Labor Statistics, Job Openings and Labor Turnover Survey, Table 4","date":"Sep 2026","n":null,"url":"https://www.bls.gov/news.release/jolts.htm"},"mgma_ma_hiring":{"line":"The U.S. had 833,900 medical assistant jobs in 2025. BLS projects 13% growth from 2025 to 2035. Median AI do that? How to tell if your AI tool really worked","example":"https://www.youtube.com/shorts/EiVNFQ68RQQ"}]},"none_questions":["PMO-01","PMO-02","PMO-03"],"task":{"text":"Which front-office task would you most like software to take off your staff?","heading":"First task to hand to software","benchmark":"mgma_access_targets","options":[{"value":"scheduling","label":"Scheduling","line":"You picked scheduling. The Assessment measures that workflow first."},{"value":"calls","label":"Phone calls","line":"You picked phone calls. The Assessment measures that workflow first."},{"value":"registration","label":"Registration and eligibility","line":"You picked registration and eligibility. The Assessment measures that workflow first."},{"value":"priorauth","label":"Prior authorization","line":"You picked prior authorization. The Assessment measures that workflow first."},{"value":"other","label":"Something else","line":"You picked another task. The Assessment measures that workflow first."},{"value":"nonenow","label":"None now","line":"You picked no task for now. The Assessment shows which task to hand to software first."}]},"scorecard_link":{"url":"scorecard.html","label":"Continue to the ScoreCard","line":"Your answers carry over, so the ScoreCard opens with them filled in. The link holds only your answers, never your name or practice.","version":"3"}},"build":"2026-11-20 14:28"};</script>
<script>// Free-tool scoring engine. Pure functions, no DOM. Shared by the page and the test script.
// Spec: outputs/design_181_free-tool-engine_2026-11-04.md (vault), sections 1 and 2.
var Engine = (function () {
  function lowerFirst(s) { return s.charAt(0).toLowerCase() + s.slice(1); }

  function score(bank, scale, setup, answers) {
    var count = answers.COUNT;
    var opt = setup.count.options.filter(function (o) { return o.value === count; })[0];
    if (!opt) throw new Error("Missing answer: COUNT");
    var none = count === "none";
    // "None" tools: short path, only the project oversight statements (ruling 84).
    var active = none ? setup.none_questions : setup.questions;
    var taskOpt = setup.task.options.filter(function (o) { return o.value === answers.TASK; })[0];
    if (!taskOpt) throw new Error("Missing answer: TASK");
    var tb = scale.benchmarks[setup.task.benchmark];
    if (!tb) throw new Error("Unknown benchmark key: " + setup.task.benchmark);
    var task = { heading: setup.task.heading, label: taskOpt.label, line: taskOpt.line, peer: shown(tb) ? tb : null };
    var byId = {};
    bank.questions.forEach(function (q) { byId[q.id] = q; });
    var domainInfo = {};
    bank.domains.forEach(function (d) { domainInfo[d.key] = d; });

    // Domains in the order the setup lists their questions.
    var order = [], doms = {};
    active.forEach(function (id) {
      var q = byId[id];
      if (!q) throw new Error("Unknown question id: " + id);
      if (!doms[q.domain]) {
        doms[q.domain] = { key: q.domain, name: domainInfo[q.domain].name, points: 0, notSure: 0,
                           questions: [], next_step: q.next_step };
        order.push(q.domain);
      }
      var a = answers[id];
      if (!(a in scale.answers)) throw new Error("Missing answer: " + id);
      doms[q.domain].questions.push(q);
      if (scale.answers[a] === null) { doms[q.domain].na = (doms[q.domain].na || 0) + 1; return; } // Does not apply: left out.
      doms[q.domain].points += scale.answers[a]; // "Not sure" scores as None.
      if (a === "notsure") doms[q.domain].notSure++;
    });

    var domains = order.map(function (k) {
      var d = doms[k], n = d.questions.length - (d.na || 0);
      d.percent = n ? Math.round(d.points / n) : null;
      d.unknown = !n || d.notSure * 2 >= n;
      if (d.unknown) { d.level = null; d.label = d.percent === null ? "Does not apply" : scale.unknown_label; }
      else {
        d.level = scale.level_bands.filter(function (b) { return d.percent >= b.min; })[0].level;
        d.label = scale.levels[String(d.level)];
      }
      d.rank = scale.tie_order.indexOf(k);
      return d;
    });

    var scored = domains.filter(function (d) { return !d.unknown; });
    var average = null, tier = scale.unknown_tier;
    if (scored.length) {
      var sum = scored.reduce(function (s, d) { return s + d.level; }, 0);
      average = Math.round((sum / scored.length) * 10) / 10;
      tier = scale.tiers.filter(function (t) { return average >= t.min; })[0];
    }

    // 2 lowest scored domains by percent; ties follow the fixed tie order.
    var lowest = scored.slice().sort(function (a, b) {
      return (a.percent - b.percent) || (a.rank - b.rank);
    }).slice(0, 2);

    var plan = lowest.map(function (d) { return { domain: d.name, next_step: d.next_step }; });
    var rf = scale.review_first;
    if (rf.when.indexOf(answers[rf.question]) >= 0) plan.unshift({ domain: rf.domain, next_step: rf.next_step });

    var findOut = active.filter(function (id) { return answers[id] === "notsure"; })
      .map(function (id) { return setup.find_out_prefix + lowerFirst(byId[id].text); });
    if (count === "notsure") findOut.unshift(setup.count.notsure_find_out);

    // One peer line for each of the 2 lowest domains that has one, with a line that places the answer.
    var peers = lowest.filter(function (d) { return domainInfo[d.key].benchmark; }).map(function (d) {
      var b = scale.benchmarks[domainInfo[d.key].benchmark];
      if (!b) throw new Error("Unknown benchmark key: " + domainInfo[d.key].benchmark);
      var pl = b.place ? b.place.by_answer[answers[b.place.question]] : null;
      return Object.assign({}, b, { placement: ph(pl) ? null : pl });
    }).filter(shown);
    var top = setup.top_benchmarks.map(function (k) {
      if (!scale.benchmarks[k]) throw new Error("Unknown benchmark key: " + k);
      return scale.benchmarks[k];
    }).filter(shown);

    return { none: none, message: none ? setup.count.none_message : null, questions: active, task: task,
             headline: opt.headline, neutral: scale.neutral_line, average: average, tier: tier,
             domains: domains, plan: plan, findOut: findOut, peers: peers, top: top, offer: ph(scale.next_step_offer) ? null : scale.next_step_offer };
  }
  // HubSpot form body: the 4 contact fields, the result ID and 1 text summary. No free text beyond the contact.
  // Throws on a missing name or practice, a bad email or an answer outside the allowed values.
  var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function hubspotBody(setup, scale, result, answers, resultId, contact, meta) {
    contact = contact || {};
    ["firstname", "lastname", "company"].forEach(function (k) {
      if (!contact[k] || !String(contact[k]).trim()) throw new Error("Missing contact field: " + k);
    });
    if (!EMAIL.test(String(contact.email || "").trim())) throw new Error("Bad email");
    if (!/^[a-z0-9]{6,}$/.test(resultId)) throw new Error("Bad result ID");
    var counts = setup.count.options.map(function (o) { return o.value; });
    if (counts.indexOf(answers.COUNT) < 0) throw new Error("Bad count answer");
    var tasks = setup.task.options.map(function (o) { return o.value; });
    if (tasks.indexOf(answers.TASK) < 0) throw new Error("Bad task answer");
    var parts = ["time=" + meta.time, "build=" + meta.build, "count=" + answers.COUNT, "task=" + answers.TASK];
    {
      parts.push("answers=" + result.questions.map(function (id) {
        if (!(answers[id] in scale.answers)) throw new Error("Bad answer: " + id);
        return id + ":" + answers[id];
      }).join(","));
      parts.push("domains=" + result.domains.map(function (d) {
        return d.name + ":" + (d.unknown ? "Unknown" : d.percent + "%:L" + d.level);
      }).join(","));
      parts.push("average=" + (result.average === null ? "none" : result.average.toFixed(1)));
      parts.push("tier=" + (result.none ? "None" : result.tier.name));
    }
    var f = function (name, value) { return { objectTypeId: "0-1", name: name, value: String(value).trim() }; };
    return { fields: [f("firstname", contact.firstname), f("lastname", contact.lastname), f("company", contact.company),
                      f("email", contact.email), f("fpc_result_id", resultId), f("fpc_result", parts.join(" | "))] };
  }
  // ---- #408 ScoreCard (design outputs/design_408-scorecard_2026-11-14.md, Gate 1 and 3 rulings) ----
  // Rows: the 24 free rows (scored in the domain their maps_to names) plus the 40 step: scorecard rows.
  // Poll rows (kind: poll) mirror an MGMA poll; they place the practice and are not scored.
  function scRows(bank, sc, count) {
    var free = count === "none" ? sc.none_free : sc.free_questions;
    var skip = count === "none" ? (sc.none_skip || []) : [];
    var neu = bank.questions.filter(function (q) { return q.step === "scorecard" && skip.indexOf(q.id) < 0; }).map(function (q) { return q.id; });
    return free.concat(neu);
  }
  // Setup questions (ruling F-1): an answer can mark rows Does not apply. Returns the row IDs it marks.
  function setupNa(sc, answers) {
    var out = [];
    ((sc.setup || {}).questions || []).forEach(function (s) {
      s.options.forEach(function (o) { if (answers[s.id] === o.value && o.na) out = out.concat(o.na); });
    });
    return out;
  }
  // Preselects Does not apply on rows the setup marks, and only on rows with no answer yet.
  // auto = the rows the setup filled before. A row the setup filled and no longer marks is cleared,
  // but only if it still holds Does not apply, so an answer the practice typed is never erased.
  function applySetup(sc, answers, auto) {
    var want = setupNa(sc, answers), keep = [];
    (auto || []).forEach(function (id) {
      if (want.indexOf(id) >= 0 && answers[id] === "na") keep.push(id);
      else if (want.indexOf(id) < 0 && answers[id] === "na") delete answers[id];
    });
    want.forEach(function (id) { if (!answers[id]) { answers[id] = "na"; keep.push(id); } });
    return keep;
  }
  function setupDone(sc, answers) {
    return ((sc.setup || {}).questions || []).every(function (s) {
      return s.options.some(function (o) { return o.value === answers[s.id]; });
    });
  }
  // asOf (optional Date): MGMA lines older than scale.poll_max_age_days are marked stale and not shown.
  function scoreCard(bank, scale, sc, answers, asOf) {
    var count = answers.COUNT;
    if (!sc.count.options.some(function (o) { return o.value === count; })) throw new Error("Missing answer: COUNT");
    var byId = {};
    bank.questions.forEach(function (q) { byId[q.id] = q; });
    var ids = scRows(bank, sc, count), doms = {};
    sc.domains.forEach(function (d) {
      doms[d.key] = { key: d.key, name: d.name, info: d, points: 0, n: 0, notSure: 0,
                      free: { points: 0, n: 0 }, neu: { points: 0, n: 0 }, groups: {}, held: [], poll: null, na: 0, setupNa: [] };
    });
    var fromSetup = setupNa(sc, answers);
    var findOut = [];
    if (count === "notsure") findOut.push(sc.count.notsure_find_out);
    ids.forEach(function (id) {
      var q = byId[id];
      if (!q) throw new Error("Unknown question id: " + id);
      var d = doms[q.maps_to], a = answers[id];
      if (!d) throw new Error("Unknown domain for " + id);
      if (q.kind === "poll") {
        var o = q.options.filter(function (x) { return x.value === a; })[0];
        if (!o) throw new Error("Missing answer: " + id);
        d.poll = { question: q.text, answer: o.label, placement: o.place };
        if (a === "notsure") findOut.push(q.find_out);
        return;
      }
      if (!(a in scale.answers)) throw new Error("Missing answer: " + id);
      var v = scale.answers[a], part = q.step === "free" ? d.free : d.neu;
      if (v === null) { d.na++; if (fromSetup.indexOf(id) >= 0) d.setupNa.push(q.text); return; } // Does not apply: left out of the score.
      d.points += v; d.n++; part.points += v; part.n++;
      if (q.group) { var gp = d.groups[q.group] = d.groups[q.group] || { points: 0, n: 0 }; gp.points += v; gp.n++; }
      if (a === "notsure") { d.notSure++; findOut.push(sc.find_out_prefix + lowerFirst(q.text)); }
      if (a === "none") d.held.push(q.text);
    });
    var domains = sc.domains.map(function (info) {
      var d = doms[info.key];
      d.percent = d.n ? Math.round(d.points / d.n) : null;
      d.fromFree = d.free.n ? Math.round(d.free.points / d.free.n) : null;
      d.fromNew = d.neu.n ? Math.round(d.neu.points / d.neu.n) : null;
      d.unknown = !d.n || d.notSure * 2 >= d.n;
      if (d.unknown) { d.level = null; d.label = d.percent === null ? "Does not apply" : scale.unknown_label; }
      else {
        d.level = scale.level_bands.filter(function (b) { return d.percent >= b.min; })[0].level;
        d.label = scale.levels[String(d.level)];
      }
      d.rank = sc.tie_order.indexOf(info.key);
      // MGMA lines: the main poll with its placing sentence, and the second poll as context only.
      d.main = scale.benchmarks[info.main];
      if (!d.main) throw new Error("Unknown benchmark key: " + info.main);
      d.mainStale = stale(scale, d.main, asOf);
      if (info.main_question) {
        d.placement = ids.indexOf(info.main_question) >= 0 ? d.main.place.by_answer[answers[info.main_question]] : null;
      } else d.placement = d.poll ? d.poll.placement : null;
      d.context = info.context ? scale.benchmarks[info.context] : null;
      if (info.context && !d.context) throw new Error("Unknown benchmark key: " + info.context);
      if (d.context && stale(scale, d.context, asOf)) d.context = null;
      if (d.mainStale || ph(d.placement)) d.placement = null;
      var num = answers[info.number.id];
      if (num != null && num !== "") {
        num = Number(num);
        if (!isFinite(num) || num < 0 || (info.number.kind === "pct" && num > 100)) throw new Error("Bad number: " + info.number.id);
        d.number = { label: info.number.label, value: num };
      } else d.number = null;
      d.note = info.key === "D5" && count === "none" ? sc.no_ai_note : null;
      d.next_step = info.next_step; d.assess_next = info.assess_next; d.info_first = info.first_step || null;
      if (info.sub_lines) d.subLines = info.sub_lines.groups.map(function (g) {
        var gp = d.groups[g]; return [g, gp && gp.n ? Math.round(gp.points / gp.n) : null];
      });
      delete d.points; delete d.free; delete d.neu; delete d.info; delete d.groups;
      return d;
    });
    var scored = domains.filter(function (d) { return !d.unknown; });
    // Round 2 finding 1 (#433): an Unknown domain counts as Level 1 in the tier. A domain where nothing applies stays out.
    var inTier = domains.filter(function (d) { return d.n > 0; });
    var average = null, tier = sc.unknown_tier;
    // A tier only when enough domains count (finding 16), so 1 domain cannot set it.
    if (inTier.length && inTier.length >= (sc.min_scored_domains || 1)) {
      average = Math.round(inTier.reduce(function (s, d) { return s + (d.unknown ? 1 : d.level); }, 0) / inTier.length * 10) / 10;
      tier = sc.tiers.filter(function (t) { return average >= t.min; })[0];
    }
    var gaps = scored.slice().sort(function (a, b) { return (a.percent - b.percent) || (a.rank - b.rank); }).slice(0, sc.gap_count);
    var plan = gaps.map(function (d) { return { key: d.key, domain: d.name, first_step: d.info_first, next_step: d.next_step, assess_next: d.assess_next }; });
    var rf = scale.review_first;
    if (ids.indexOf(rf.question) >= 0 && rf.when.indexOf(answers[rf.question]) >= 0)
      plan.unshift({ key: null, domain: rf.domain, next_step: rf.next_step, assess_next: null });
    return { count: count, questions: ids, domains: domains, average: average, tier: tier,
             gaps: gaps.map(function (d) { return d.key; }), plan: plan, findOut: findOut, neutral: scale.neutral_line,
             pollNote: ph(scale.poll_note) ? null : (scale.poll_note || null) };
  }
  // A line that still holds the placeholder is never shown (#408 build 11/17).
  var REV = "{REVISION NEEDED HERE}";
  function ph(s) { return typeof s === "string" && s.indexOf(REV) >= 0; }
  function shown(b) { return !!b && !ph(b.line) && !ph(b.source) && !ph(b.url); }
  // The age rule applies to poll lines only (they carry a stat_id). Public data lines have no age limit.
  function stale(scale, b, asOf) {
    if (!shown(b)) return true;
    if (!b.stat_id) return false;
    if (!asOf || !scale.poll_max_age_days || !b.date) return false;
    var t = Date.parse(b.date);
    return isFinite(t) && (asOf.getTime() - t) > scale.poll_max_age_days * 864e5;
  }

  // Prefill code (Gate 3 ruling 3-1): version . tool count . 1 letter per free row. It lives after # only.
  var COUNT_CODE = { "none": "n", "1": "1", "2-3": "2", "4+": "4", "notsure": "u" };
  var ANS_CODE = { all: "a", most: "m", half: "h", few: "f", none: "n", notsure: "u", na: "d" };
  var PARTIAL = ["most", "half", "few"]; // no meaning for 1 tool
  function invert(o) { var r = {}; Object.keys(o).forEach(function (k) { r[o[k]] = k; }); return r; }
  function encodePrefill(version, order, answers) {
    var cc = COUNT_CODE[answers.COUNT];
    if (!cc) throw new Error("Bad count answer");
    return "p=" + version + "." + cc + "." + order.map(function (id) { return ANS_CODE[answers[id]] || "x"; }).join("");
  }
  // Returns { answers, prefilled } or null. A bad or unknown code returns null, so the page opens empty.
  function decodePrefill(bank, sc, hash) {
    var m = /^#?p=(\d+)\.([n124u])\.([amhfnudx]+)$/.exec(String(hash || ""));
    if (!m) return null;
    var ver = sc.prefill.versions[m[1]];
    if (!ver || m[3].length !== ver.order.length) return null;
    var count = invert(COUNT_CODE)[m[2]], ans = invert(ANS_CODE), cur = {};
    bank.questions.forEach(function (q) { cur[q.id] = q.version; });
    var allowed = count === "none" ? sc.none_free : sc.free_questions;
    var out = { COUNT: count }, prefilled = [];
    ver.order.forEach(function (id, i) {
      var a = ans[m[3].charAt(i)];
      if (!a || allowed.indexOf(id) < 0 || ver.rows[id] !== cur[id]) return; // a changed row is answered again
      if (PARTIAL.indexOf(a) >= 0 && count === "1" && sc.none_free.indexOf(id) < 0) return;
      out[id] = a; prefilled.push(id);
    });
    return { answers: out, prefilled: prefilled };
  }
  function scorecardBody(sc, scale, result, answers, resultId, contact, meta) {
    contact = contact || {};
    ["firstname", "lastname", "company"].forEach(function (k) {
      if (!contact[k] || !String(contact[k]).trim()) throw new Error("Missing contact field: " + k);
    });
    if (!EMAIL.test(String(contact.email || "").trim())) throw new Error("Bad email");
    if (!/^[a-z0-9]{6,}$/.test(resultId)) throw new Error("Bad result ID");
    var roles = ((sc.contact || {}).role || { options: [] }).options.map(function (o) { return o[0]; });
    if (roles.length && roles.indexOf(contact.role) < 0) throw new Error("Missing contact field: role");
    var parts = ["product=scorecard", "role=" + (contact.role || "none"), "time=" + meta.time, "build=" + meta.build, "prefilled=" + (meta.prefilled ? "yes" : "no"),
                 "count=" + result.count,
                 "setup=" + ((sc.setup || {}).questions || []).map(function (s) { return s.id + ":" + (answers[s.id] || "none"); }).join(","),
                 "answers=" + result.questions.map(function (id) { return id + ":" + answers[id]; }).join(","),
                 "numbers=" + result.domains.filter(function (d) { return d.number; }).map(function (d) { return d.key + ":" + d.number.value; }).join(","),
                 "domains=" + result.domains.map(function (d) { return d.key + ":" + (d.unknown ? "Unknown" : d.percent + "%:L" + d.level); }).join(","),
                 "average=" + (result.average === null ? "none" : result.average.toFixed(1)), "tier=" + result.tier.name];
    var f = function (name, value) { return { objectTypeId: "0-1", name: name, value: String(value).trim() }; };
    return { fields: [f("firstname", contact.firstname), f("lastname", contact.lastname), f("company", contact.company),
                      f("email", contact.email), f("fpc_result_id", resultId), f("fpc_result", parts.join(" | "))] };
  }

  return { score: score, hubspotBody: hubspotBody, scRows: scRows, scoreCard: scoreCard,
           setupNa: setupNa, applySetup: applySetup, setupDone: setupDone,
           shown: shown, encodePrefill: encodePrefill, decodePrefill: decodePrefill, scorecardBody: scorecardBody };
})();
if (typeof module !== "undefined") module.exports = Engine;
</script>
<script>// Page runner: draws the statements from the inlined data and shows the result.
(function () {
  var DATA = window.FREE_TOOL_DATA;
  var bank = DATA.bank, scale = DATA.scale, setup = DATA.setup;
  var byId = {};
  bank.questions.forEach(function (q) { byId[q.id] = q; });
  var answers = {};
  // 1 result ID per page load, so a second click sends the same ID.
  var resultId = Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  var HUBSPOT_URL = "https://api.hsforms.com/submissions/v3/integration/submit/" +
    setup.hubspot.portal + "/" + setup.hubspot.form;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  document.title = setup.name;
  document.getElementById("tool-name").textContent = setup.name;
  document.getElementById("tool-question").textContent = setup.question;
  document.getElementById("tool-intro").textContent = setup.intro;

  function peerLine(b, cls) {
    var p = el("p", cls, b.line + " ");
    var src = el("span", "source");
    src.appendChild(document.createTextNode("(" + b.source + ", " + b.date + ", " +
      (b.n ? b.n.toLocaleString("en-US") + " responses, " : "")));
    var a = el("a", null, "source");
    a.href = b.url; a.target = "_blank"; a.rel = "noopener";
    src.appendChild(a);
    src.appendChild(document.createTextNode(")"));
    p.appendChild(src);
    return p;
  }
  // The 2 fixed peer lines show once, at the top of the page.
  var topBox = document.getElementById("top-peers");
  setup.top_benchmarks.forEach(function (k) { if (Engine.shown(scale.benchmarks[k])) topBox.appendChild(peerLine(scale.benchmarks[k], "peer")); });
  document.getElementById("answer-prompt").textContent = setup.answer_prompt;

  var list = document.getElementById("statements");
  var btn = document.getElementById("see-result");
  var choices = setup.choices;

  // Contact form: all 4 fields required before the result shows (ruling 82).
  var contact = {};
  document.getElementById("contact-heading").textContent = setup.contact.heading;
  document.getElementById("contact-privacy").textContent = setup.contact.privacy;
  var cf = document.getElementById("contact-fields");
  setup.contact.fields.forEach(function (f) {
    var label = el("label", null, f[1]);
    var input = document.createElement("input");
    input.name = f[0]; input.required = true; input.maxLength = 100; input.autocomplete = f[2];
    input.type = f[0] === "email" ? "email" : "text";
    input.addEventListener("input", function () { contact[f[0]] = input.value; update(); });
    label.appendChild(input);
    cf.appendChild(label);
  });
  function contactOk() {
    return ["firstname", "lastname", "company"].every(function (k) { return contact[k] && contact[k].trim(); }) &&
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((contact.email || "").trim());
  }

  function active() { return answers.COUNT === "none" ? setup.none_questions : setup.questions; }
  function update() {
    var act = active();
    var done = act.filter(function (id) { return answers[id]; }).length;
    var answered = !!answers.COUNT && !!answers.TASK && done === act.length;
    btn.disabled = !answered || !contactOk();
    document.getElementById("progress").textContent = answers.COUNT ? done + " of " + act.length + " answered" : "";
  }

  // Count question: not scored; sets the headline and the "None" path.
  var countBox = document.getElementById("count");
  countBox.appendChild(el("p", "statement-text count-text", setup.count.text));
  var cg = el("div", "choices");
  cg.setAttribute("role", "radiogroup");
  cg.setAttribute("aria-label", "Number of AI tools");
  setup.count.options.forEach(function (o) {
    var label = el("label", "choice");
    var input = document.createElement("input");
    input.type = "radio"; input.name = "COUNT"; input.value = o.value;
    input.addEventListener("change", function () {
      answers.COUNT = o.value;
      // "None": show only the project oversight statements (ruling 84).
      var act = active();
      document.getElementById("answer-prompt").hidden = o.value === "none";
      Array.prototype.forEach.call(list.children, function (li) { li.hidden = act.indexOf(li.dataset.id) < 0; });
      // "A few", "About half" and "Most" have no meaning for 1 tool: hide them and clear those answers.
      var one = o.value === "1";
      Array.prototype.forEach.call(document.querySelectorAll('input[value="few"], input[value="half"], input[value="most"]'), function (inp) {
        inp.parentNode.hidden = one;
        if (one && inp.checked) { inp.checked = false; delete answers[inp.name]; }
      });
      update();
    });
    label.appendChild(input);
    label.appendChild(el("span", null, o.label));
    cg.appendChild(label);
  });
  countBox.appendChild(cg);

  // Task question: not scored; names the first task to hand to software (ruling 84).
  var taskBox = document.getElementById("task");
  taskBox.appendChild(el("p", "statement-text count-text", setup.task.text));
  var tg = el("div", "choices");
  tg.setAttribute("role", "radiogroup");
  tg.setAttribute("aria-label", "First task to hand to software");
  setup.task.options.forEach(function (o) {
    var label = el("label", "choice");
    var input = document.createElement("input");
    input.type = "radio"; input.name = "TASK"; input.value = o.value;
    input.addEventListener("change", function () { answers.TASK = o.value; update(); });
    label.appendChild(input);
    label.appendChild(el("span", null, o.label));
    tg.appendChild(label);
  });
  taskBox.appendChild(tg);

  setup.questions.forEach(function (id, i) {
    var q = byId[id];
    var li = el("li", "statement");
    li.dataset.id = id;
    li.appendChild(el("p", "statement-text", q.text));
    var group = el("div", "choices");
    group.setAttribute("role", "radiogroup");
    group.setAttribute("aria-label", "Statement " + (i + 1));
    choices.forEach(function (c) {
      var label = el("label", "choice");
      var input = document.createElement("input");
      input.type = "radio"; input.name = id; input.value = c[0];
      input.addEventListener("change", function () {
        answers[id] = c[0];
        update();
      });
      label.appendChild(input);
      label.appendChild(el("span", null, c[1]));
      group.appendChild(label);
    });
    li.appendChild(group);
    list.appendChild(li);
  });
  update();

  btn.addEventListener("click", function () {
    var r = Engine.score(bank, scale, setup, answers);
    var body = Engine.hubspotBody(setup, scale, r, answers, resultId, contact,
      { time: new Date().toISOString(), build: DATA.build });
    btn.disabled = true;
    btn.textContent = "Saving";
    fetch(HUBSPOT_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (res) { return res.ok; }, function () { return false; })
      .then(function (saved) {
        btn.textContent = "See my result";
        update();
        show(r, saved);
      });
  });

  function show(r, saved) {
    var out = document.getElementById("result");
    out.innerHTML = "";
    if (!saved) out.appendChild(el("p", "save-error", setup.contact.error));

    function taskBlock() {
      var st = el("section", "block");
      st.appendChild(el("h2", null, r.task.heading));
      st.appendChild(el("p", null, r.task.line));
      if (r.task.peer) st.appendChild(peerLine(r.task.peer, "peer"));
      out.appendChild(st);
    }
    function nextStep() {
      var s5 = el("section", "block");
      s5.appendChild(el("h2", null, "Next step"));
      s5.appendChild(el("p", "neutral", r.neutral));
      if (r.offer) s5.appendChild(el("p", null, r.offer));
      // #408 Gate 3 ruling 3-1: the answers ride after # in the link, so no server sees them.
      var sl = setup.scorecard_link;
      if (sl) {
        var a = el("a", "scorecard-link", sl.label);
        a.href = sl.url + "#" + Engine.encodePrefill(sl.version, setup.questions, answers);
        s5.appendChild(el("p")).appendChild(a);
        s5.appendChild(el("p", "source", sl.line));
      }
      out.appendChild(s5);
    }
    function finish() {
      var sb = el("section", "block subscribe");
      sb.appendChild(el("h2", null, setup.subscribe.heading));
      sb.appendChild(el("p", null, setup.subscribe.line));
      var ul = el("ul");
      setup.subscribe.rows.forEach(function (row) {
        var li = el("li");
        li.appendChild(el("strong", null, row.channel + ": "));
        var a1 = el("a", null, row.action);
        a1.href = row.url; a1.target = "_blank"; a1.rel = "noopener";
        li.appendChild(a1);
        li.appendChild(document.createTextNode(". " + row.verb + " "));
        var a2 = el("a", null, '"' + row.title + '"');
        a2.href = row.example; a2.target = "_blank"; a2.rel = "noopener";
        li.appendChild(a2);
        li.appendChild(document.createTextNode("."));
        ul.appendChild(li);
      });
      sb.appendChild(ul);
      out.appendChild(sb);
      var pr = el("button", "print", "Print or save as PDF");
      pr.type = "button";
      pr.addEventListener("click", function () { window.print(); });
      out.appendChild(pr);
      out.hidden = false;
      out.scrollIntoView({ behavior: "smooth" });
    }

    if (r.none) {
      var s0 = el("section", "block");
      s0.appendChild(el("h2", null, "Your result"));
      s0.appendChild(el("p", null, r.message));
      out.appendChild(s0);
      levels();
      planBlock(false);
      taskBlock();
      nextStep();
      finish();
      return;
    }

    // 1. Result
    var s1 = el("section", "block");
    s1.appendChild(el("h2", null, "Your result"));
    var tierLine = el("p", "tier");
    tierLine.appendChild(document.createTextNode(r.headline + ": "));
    tierLine.appendChild(el("strong", null, r.tier.name));
    if (r.average !== null) tierLine.appendChild(document.createTextNode(" (average level " + r.average.toFixed(1) + " of 4.0)"));
    s1.appendChild(tierLine);
    s1.appendChild(el("p", null, r.tier.explain));
    out.appendChild(s1);

    levels();
    function levels() {
    // 2. Domain levels
    var s2 = el("section", "block");
    s2.appendChild(el("h2", null, "Domain levels"));
    r.domains.forEach(function (d) {
      var row = el("div", "domain-row");
      row.appendChild(el("span", "domain-name", d.name));
      var bar = el("span", "bar");
      bar.setAttribute("aria-hidden", "true");
      for (var k = 1; k <= 4; k++) bar.appendChild(el("span", d.level && k <= d.level ? "seg on" : "seg"));
      row.appendChild(bar);
      var lab = d.unknown ? d.label : d.percent + "%, Level " + d.level + ", " + d.label;
      if (d.notSure > 0) lab += " · Not sure: " + d.notSure;
      row.appendChild(el("span", "domain-label", lab));
      s2.appendChild(row);
    });
    out.appendChild(s2);
    }

    // 3. Peer comparison for the lowest domains, each with a line that places the practice.
    if (r.peers.length) {
      var s3 = el("section", "block");
      s3.appendChild(el("h2", null, "How peers compare"));
      r.peers.forEach(function (b) {
        s3.appendChild(peerLine(b, "peer"));
        if (b.placement) s3.appendChild(el("p", "placement", b.placement));
      });
      out.appendChild(s3);
    }

    planBlock(true);
    function planBlock(withTier) {
    // 4. 90-day decision plan
    var s4 = el("section", "block");
    s4.appendChild(el("h2", null, "Your 90-day decision plan"));
    if (withTier) s4.appendChild(el("p", "decision", r.tier.decision));
    var ol = el("ol");
    r.plan.forEach(function (p) {
      var li = el("li");
      li.appendChild(el("strong", null, p.domain + ": "));
      li.appendChild(document.createTextNode(p.next_step));
      ol.appendChild(li);
    });
    s4.appendChild(ol);
    if (r.findOut.length) {
      s4.appendChild(el("h3", null, "Find out"));
      var ul = el("ul");
      r.findOut.forEach(function (t) { ul.appendChild(el("li", null, t)); });
      s4.appendChild(ul);

    }
