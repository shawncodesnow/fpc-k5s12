<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Practice ScoreCard</title>
<style>
:root { --navy:#1B2A4A; --amber:#D4782A; --white:#F7F3ED; --ink:#1f2430; --muted:#5b6475; --line:#d9d2c5; }
* { box-sizing: border-box; }
body { margin:0; background:var(--white); color:var(--ink); font:16px/1.55 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
header { background:var(--navy); color:var(--white); padding:28px 16px; }
header .wrap, main { max-width:760px; margin:0 auto; }
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight:normal; }
h1 { margin:0 0 6px; font-size:30px; }
header p { margin:4px 0; }
.question { color:#f0c9a3; font-size:18px; }
main { padding:24px 16px 48px; }
ol#statements { list-style:none; padding:0; margin:0; counter-reset:s; }
.statement { counter-increment:s; background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin:0 0 12px; }
.statement-text { margin:0 0 10px; }
.statement-text::before { content: counter(s) ". "; color:var(--amber); font-weight:600; }
.choices { display:flex; flex-wrap:wrap; gap:8px; }
.choice { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
.choice:has(input:checked) { border-color:var(--navy); background:#e9edf5; }
.actions { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:20px 0; }
#progress { color:var(--muted); }
button { font:inherit; border:0; border-radius:6px; padding:10px 18px; cursor:pointer; background:var(--amber); color:#fff; }
button:disabled { background:#c9c2b6; cursor:not-allowed; }
#result { border-top:3px solid var(--navy); margin-top:24px; padding-top:8px; }
.block { margin:18px 0; }
.block h2 { color:var(--navy); margin:0 0 8px; font-size:22px; }
.tier { font-size:20px; margin:0 0 4px; }
.tier strong { color:var(--amber); }
.domain-row { display:grid; grid-template-columns: 1fr auto; gap:4px 12px; padding:8px 0; border-bottom:1px solid var(--line); }
.domain-name { font-weight:600; }
.bar { display:flex; gap:3px; align-self:center; }
.seg { width:36px; height:10px; border-radius:2px; background:#e3ddd2; }
.seg.on { background:var(--navy); }
.domain-label { grid-column:1 / -1; color:var(--muted); font-size:14px; }
.source { color:var(--muted); font-size:14px; }
.source a { color:var(--navy); }
.decision { font-weight:600; }
.count-text { font-weight:600; }
.count { counter-increment:none; }
.count-text::before { content:none; }
.neutral { font-weight:600; color:var(--navy); }
#top-peers { margin-top:14px; border-top:1px solid #34456b; padding-top:10px; }
#top-peers .peer { font-size:15px; margin:6px 0; }
#top-peers .source, #top-peers .source a { color:#c9d1e0; }
.answer-prompt { font-weight:600; margin:18px 0 10px; }
.placement { margin:-4px 0 12px; font-weight:600; color:var(--navy); }
.contact { counter-increment:none; }
.contact h2 { color:var(--navy); margin:0 0 10px; font-size:20px; }
.contact-fields { display:grid; grid-template-columns: 1fr 1fr; gap:10px 12px; }
.contact-fields label { display:flex; flex-direction:column; font-size:14px; color:var(--muted); gap:4px; }
.contact-fields input { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; color:var(--ink); }
@media (max-width:520px) { .contact-fields { grid-template-columns: 1fr; } }
.save-error { color:#9b2c1c; font-weight:600; }
.subscribe ul { padding-left:20px; }
.subscribe li { margin:6px 0; }
.subscribe a { color:var(--navy); }
footer { color:var(--muted); font-size:13px; max-width:760px; margin:0 auto; padding:0 16px 32px; }
@media print {
  header { background:none; color:var(--ink); padding:0 0 8px; border-bottom:2px solid var(--navy); }
  .question { color:var(--muted); }
  #top-peers .source, #top-peers .source a { color:var(--muted); }
  #questions, .actions, button.print { display:none !important; }
  #result { border-top:0; }
  .seg { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}

.domain-head { color:var(--navy); margin:28px 0 10px; font-size:22px; border-bottom:2px solid var(--line); padding-bottom:4px; }
.free-tag { display:inline-block; font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 6px; margin-left:6px; }
.number { counter-increment:none; }
.number .statement-text::before { content:none; }
.number input { font:inherit; width:140px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
.prefilled-line { background:#fff4e8; border:1px solid #f0c9a3; border-radius:8px; padding:10px 14px; }
.cover { background:var(--navy); color:var(--white); border-radius:8px; padding:18px 20px; }
.cover h2 { color:var(--white); }
.cover .tier strong { color:#f0c9a3; }
.dblock { border:1px solid var(--line); border-radius:8px; background:#fff; padding:12px 16px; margin:12px 0; break-inside:avoid; }
.statement-text::before { content:none !important; }
.dblock h3 { margin:0 0 4px; color:var(--navy); font-size:19px; }
.sub { color:var(--muted); font-size:14px; margin:2px 0; }
.note { font-style:italic; }
.scorecard-link { font-weight:600; color:var(--navy); }
@media print { .cover { background:none; color:var(--ink); border:2px solid var(--navy); } .cover h2 { color:var(--navy); } .cover .tier strong { color:var(--amber); } }
.group-head{list-style:none;font-weight:600;margin:16px 0 6px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="tool-name"></h1>
  <p class="question" id="tool-question"></p>
  <p id="tool-intro"></p>
</div></header>
<main>
  <section id="questions">
    <p id="prefilled" class="prefilled-line" hidden></p>
    <p id="consent" class="answer-prompt"></p>
    <div id="count" class="statement count"></div>
    <p id="answer-prompt" class="answer-prompt"></p>
    <div id="domains"></div>
    <section id="contact" class="statement contact">
      <h2 id="contact-heading"></h2>
      <div id="contact-fields" class="contact-fields"></div>
      <p id="contact-privacy" class="source"></p>
    </section>
    <div class="actions">
      <button id="see-result" type="button" disabled>See my ScoreCard</button>
      <span id="progress"></span>
    </div>
  </section>
  <section id="result" hidden></section>
</main>
<footer id="footer"></footer>
<script>window.FREE_TOOL_DATA = {"bank":{"domains":[{"key":"governance","name":"Governance and risk","maps_to":["D7"],"benchmark":"mgma_ai_policy"},{"key":"workflow","name":"Workflow fit","maps_to":["D5"],"benchmark":"mgma_role_redesign"},{"key":"data","name":"Data and integration","maps_to":["D4","D5"],"benchmark":null},{"key":"people","name":"People and change","maps_to":["D6"],"benchmark":null},{"key":"buyer","name":"Proof of value","maps_to":["D8"],"benchmark":"mgma_work_shift"},{"key":"oversight","name":"Project oversight","maps_to":["D7"],"benchmark":null}],"questions":[{"id":"GOV-01","domain":"governance","maps_to":"D7","anchor":"L3","step":"free","version":5,"text":"Each AI tool is named in a written AI use policy.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-05","domain":"governance","maps_to":"D7","anchor":"L3","step":"free","version":2,"text":"Each AI vendor whose tool touches patient information signed a business associate agreement (BAA) with your practice.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-02","domain":"governance","maps_to":"D7","anchor":"L4","step":"free","version":3,"text":"A named person or group approved each AI tool before staff used it.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-03","domain":"governance","maps_to":"D7","anchor":"L3","step":"free","version":3,"text":"Each AI tool that staff use, free ones included, is on a written list that you updated in the last 6 months.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-04","domain":"governance","maps_to":"D7","anchor":"L4","step":"free","version":3,"text":"For each AI tool that writes to the chart or to a claim, a staff member reviews its output first.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-06","domain":"governance","maps_to":"D7","anchor":"L4","step":"free","version":2,"text":"Staff ask each patient before an AI tool records the visit.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-09","domain":"governance","maps_to":"D7","anchor":"L4","step":"free","version":1,"text":"You tell patients when AI drafts the messages they get.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-07","domain":"governance","maps_to":"D7","anchor":"L3","step":"free","version":2,"text":"Your AI tool list marks each tool as 'acts on its own' or 'drafts for staff'.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"GOV-08","domain":"governance","maps_to":"D7","anchor":"L4","step":"free","version":2,"text":"Each AI tool that acts on its own has written limits on what it may do without a person's approval.","next_step":"Start from the AMA model AI policy. Write a one-page policy, list every AI tool, confirm each BAA, and name who approves new tools and projects.","group":"AI rules"},{"id":"WRK-01","domain":"workflow","maps_to":"D5","anchor":"L3","step":"free","version":4,"text":"For each AI tool, you wrote down the 1 task it must improve.","next_step":"For each tool, name its workflow and count that workflow's time or errors for 2 weeks."},{"id":"WRK-02","domain":"workflow","maps_to":"D5","anchor":"L4","step":"free","version":4,"text":"Before each AI tool started, you measured the time or error count of its task.","next_step":"For each tool, name its workflow and count that workflow's time or errors for 2 weeks."},{"id":"WRK-03","domain":"workflow","maps_to":"D5","anchor":"L4","step":"free","version":3,"text":"For each AI tool, you wrote down who does what differently now.","next_step":"For each tool, name its workflow and count that workflow's time or errors for 2 weeks."},{"id":"DAT-01","domain":"data","maps_to":"D4","anchor":"L3","step":"free","version":4,"text":"Each AI tool reads from your EHR without staff copying data by hand.","next_step":"Ask each vendor which EHR fields its tool reads and writes, and for a monthly use report."},{"id":"DAT-02","domain":"data","maps_to":"D5","anchor":"L4","step":"free","version":4,"text":"For each AI tool, you can get a monthly report of its work volume, such as notes drafted or calls handled.","next_step":"Ask each vendor which EHR fields its tool reads and writes, and for a monthly use report."},{"id":"DAT-03","domain":"data","maps_to":"D5","anchor":"L3","step":"free","version":3,"text":"You can see who uses each AI tool and how often.","next_step":"Ask each vendor which EHR fields its tool reads and writes, and for a monthly use report."},{"id":"PPL-01","domain":"people","maps_to":"D6","anchor":"L3","step":"free","version":4,"text":"More than half of the staff each AI tool was bought for use it each week.","next_step":"Count last week's users of each tool, check each patient-care tool for bias, and ask clinicians before the next purchase."},{"id":"PPL-04","domain":"people","maps_to":"D7","anchor":"L4","step":"free","version":2,"text":"For each AI tool that supports patient care decisions, you asked the vendor in writing whether it uses race, color, national origin, sex, age or disability as an input.","next_step":"Count last week's users of each tool, check each patient-care tool for bias, and ask clinicians before the next purchase.","group":"AI rules"},{"id":"PPL-03","domain":"people","maps_to":"D6","anchor":"L3","step":"free","version":3,"text":"For each AI tool that clinicians use, at least 1 of them tested it before the purchase.","next_step":"Count last week's users of each tool, check each patient-care tool for bias, and ask clinicians before the next purchase."},{"id":"BUY-01","domain":"buyer","maps_to":"D8","anchor":"L3","step":"free","version":4,"text":"For each AI tool, you have a written yearly cost that includes fees, add-ons and staff time.","next_step":"Add up each tool's yearly cost, set the dollar return it must reach, and set a keep-or-stop date. Put each tool on one project list with an owner and a go, hold or stop date."},{"id":"BUY-02","domain":"buyer","maps_to":"D8","anchor":"L4","step":"free","version":4,"text":"You compared each AI tool's cost with a measured return in dollars.","next_step":"Add up each tool's yearly cost, set the dollar return it must reach, and set a keep-or-stop date. Put each tool on one project list with an owner and a go, hold or stop date."},{"id":"BUY-03","domain":"buyer","maps_to":"D8","anchor":"L4","step":"free","version":3,"text":"You set a date to decide whether to keep or stop each AI tool.","next_step":"Add up each tool's yearly cost, set the dollar return it must reach, and set a keep-or-stop date. Put each tool on one project list with an owner and a go, hold or stop date."},{"id":"PMO-01","domain":"oversight","maps_to":"D7","anchor":"L3","step":"free","version":2,"text":"Each open AI or IT project is on 1 list with a named owner.","next_step":"List every open AI and IT project, name 1 owner for each, and review the list with your leaders once a month.","group":"Project oversight"},{"id":"PMO-02","domain":"oversight","maps_to":"D7","anchor":"L4","step":"free","version":2,"text":"One person or group decides which new AI tools and projects start, hold or stop.","next_step":"List every open AI and IT project, name 1 owner for each, and review the list with your leaders once a month.","group":"Project oversight"},{"id":"PMO-03","domain":"oversight","maps_to":"D7","anchor":"L4","step":"free","version":1,"text":"Your leaders review each open project's status at a set time each month.","next_step":"List every open AI and IT project, name 1 owner for each, and review the list with your leaders once a month.","group":"Project oversight"},{"id":"SC-D1-01","maps_to":"D1","step":"scorecard","version":2,"kind":"statement","text":"Each provider's patients can complete intake forms online before the visit."},{"id":"SC-D1-02","maps_to":"D1","step":"scorecard","version":1,"kind":"statement","text":"Each provider's schedule uses a waitlist to fill canceled slots."},{"id":"SC-D1-03","maps_to":"D1","step":"scorecard","version":2,"kind":"statement","text":"Each front desk role has a written procedure."},{"id":"SC-D1-04","maps_to":"D1","step":"scorecard","version":2,"kind":"statement","text":"Each site has 1 named person who decides schedule changes."},{"id":"SC-D1-05","maps_to":"D1","step":"scorecard","version":1,"kind":"poll","scored":false,"benchmark":"mgma_self_schedule","text":"About what share of your patients schedule their own visits online?","find_out":"Find out what share of your patients schedule their own visits online.","options":[{"value":"u25","label":"Under 25%","place":"{REVISION NEEDED HERE}"},{"value":"25-50","label":"25 to 50%","place":"{REVISION NEEDED HERE}"},{"value":"51-75","label":"51 to 75%","place":"{REVISION NEEDED HERE}"},{"value":"o75","label":"Over 75%","place":"{REVISION NEEDED HERE}"},{"value":"notsure","label":"Not sure","place":"Find out what share of your patients self-schedule to see where you stand."}]},{"id":"SC-D2-01","maps_to":"D2","step":"scorecard","version":2,"kind":"statement","text":"Each provider's charges reach billing within 1 business day of the visit."},{"id":"SC-D2-02","maps_to":"D2","step":"scorecard","version":1,"kind":"statement","text":"You track the clean claim rate for each payer every month."},{"id":"SC-D2-03","maps_to":"D2","step":"scorecard","version":2,"kind":"statement","text":"You have a report from the last 12 months that shows each major payer's share of your revenue."},{"id":"SC-D2-04","maps_to":"D2","step":"scorecard","version":2,"kind":"statement","text":"Each billing step (charge entry, claims, payment posting, follow-up) has a written procedure."},{"id":"SC-D2-06","maps_to":"D2","step":"scorecard","version":1,"kind":"statement","text":"Staff check insurance eligibility for each scheduled visit before the visit date."},{"id":"SC-D2-07","maps_to":"D2","step":"scorecard","version":1,"kind":"statement","text":"Each prior authorization request is on a list with its send date and its answer date."},{"id":"SC-D2-05","maps_to":"D2","step":"scorecard","version":2,"kind":"poll","scored":false,"benchmark":"mgma_rcm_automation","text":"This year, your revenue cycle is moving toward:","find_out":"Find out which way your revenue cycle is moving this year: more automation, no change or more manual work.","options":[{"value":"auto","label":"More automation","place":"{REVISION NEEDED HERE}"},{"value":"same","label":"No major change","place":"{REVISION NEEDED HERE}"},{"value":"manual","label":"More manual work","place":"{REVISION NEEDED HERE}"},{"value":"notsure","label":"Not sure","place":"Find out which way your revenue cycle is moving to see where you stand."}]},{"id":"SC-D3-01","maps_to":"D3","step":"scorecard","version":1,"kind":"statement","text":"You log each denial with its payer and reason.","help":"If a billing company does this, answer for the company."},{"id":"SC-D3-02","maps_to":"D3","step":"scorecard","version":3,"kind":"statement","text":"Staff take a first action on each denial within 2 business days of receiving it.","help":"If a billin kind":"statement","text":"Staff use each EHR module your practice pays for."},{"id":"SC-D4-05","maps_to":"D4","step":"scorecard","version":1,"kind":"poll","scored":false,"benchmark":"mgma_workarounds","text":"How often do your clinicians use workarounds in the EHR or practice management system?","find_out":"Find out how often your clinicians use workarounds in the EHR or practice management system.","options":[{"value":"freq","label":"Frequently","place":"{REVISION NEEDED HERE}"},{"value":"some","label":"Sometimes","place":"{REVISION NEEDED HERE}"},{"value":"rare","label":"Rarely","place":"{REVISION NEEDED HERE}"},{"value":"never","label":"Never","place":"{REVISION NEEDED HERE}"},{"value":"notsure","label":"Not sure","place":"{REVISION NEEDED HERE}"}],"help":"A workaround is a step outside the system, such as a paper note or a spreadsheet."},{"id":"SC-D5-01","maps_to":"D5","step":"scorecard","version":2,"kind":"statement","text":"Each software tool your practice pays for has 1 named owner on staff."},{"id":"SC-D5-02","maps_to":"D5","step":"scorecard","version":3,"kind":"statement","text":"Before each AI tool started, leaders wrote the result it must reach."},{"id":"SC-D5-03","maps_to":"D5","step":"scorecard","version":2,"kind":"statement","text":"More than half of the intended staff use each software system you started in the past 3 years."},{"id":"SC-D5-05","maps_to":"D5","step":"scorecard","version":1,"kind":"poll","scored":false,"benchmark":"mgma_productivity_shares","text":"Has AI made your providers more productive in the past 2 years?","find_out":"Find out whether AI made your providers more productive in the past 2 years.","options":[{"value":"yes","label":"Yes","place":"{REVISION NEEDED HERE}"},{"value":"no","label":"No","place":"{REVISION NEEDED HERE}"},{"value":"noai","label":"We use no AI","place":"{REVISION NEEDED HERE}"},{"value":"notsure","label":"Not sure","place":"{REVISION NEEDED HERE}"}]},{"id":"SC-D6-01","maps_to":"D6","step":"scorecard","version"  = average of All 100, Most 75, About half 50, A few 25, None 0, Not sure 0. Does not apply is left out. Rubric level: 0 to 24% = 1, 25 to 49% = 2, 50 to 74% = 3, 75 to 100% = 4. Level 5 needs evidence, so only the Assessment can give it. A domain with half or more Not sure answers is Unknown and stays out of the average.","level_bands":[{"min":75,"level":4},{"min":50,"level":3},{"min":25,"level":2},{"min":0,"level":1}],"levels":{"1":"Critical Gap","2":"Significant Gap","3":"Functional Baseline","4":"Strong Foundation"},"unknown_label":"Unknown: find out first","tie_order":["governance","buyer","oversight","workflow","data","people"],"tiers":[{"min":3.5,"name":"Well-Positioned","explain":"Your practice has the basics in place to run its AI tools well.","decision":"Keep your tools. Pick the next task to hand to software, and measure it first."},{"min":2.5,"name":"Functional Baseline","explain":"Your practice has some basics in place, and some gaps that limit its AI tools.","decision":"Fix the 2 lowest domains in the next 90 days. Then decide which tools to keep or stop."},{"min":1.5,"name":"Significant Gaps","explain":"Your practice has gaps that put the value of its AI tools at risk.","decision":"Hold new AI purchases. Close the 2 lowest gaps first."},{"min":0,"name":"Critical State","explain":"Your practice is missing the basics that keep its AI tools safe and worth their cost.","decision":"Hold new AI purchases. Close the 2 lowest gaps first."}],"unknown_tier":{"name":"Unknown","explain":"You answered Not sure to half or more of the statements in every domain, so the check cannot score your practice yet.","decision":"Find out the answers in the list below. Then take the check again."},"review_first":{"question":"GOV-04","when":["none","notsure"],"domain":"First, staff review","next_step":"Make staff check AI output before it goes in the chart or to a payer. Put this rule in your AI use policy."},"benchmarks":{"mgma_ai_in_visits":{"line":"{REVISION NEEDED HERE}","s <script>// Free-tool scoring engine. Pure functions, no DOM. Shared by the page and the test script.
// Spec: outputs/design_181_free-tool-engine_2026-11-04.md (vault), sections 1 and 2.
var Engine = (function () {
  function lowerFirst(s) { return s.charAt(0).toLowerCase() + s.slice(1); }

  function score(bank, scale, setup, answers) {
    var count = answers.COUNT;
    var opt = setup.count.options.filter(function (o) { return o.value === count; })[0];
    if (!opt) throw new Error("Missing answer: COUNT");
    var none = count === "none";
    // "None" tools: short path, only the project oversight statements (ruling 84).
    var active = none ? setup.none_questions : setup.questions;
    var taskOpt = setup.task.options.filter(function (o) { return o.value === answers.TASK; })[0];
    if (!taskOpt) throw new Error("Missing answer: TASK");
    var tb = scale.benchmarks[setup.task.benchmark];
    if (!tb) throw new Error("Unknown benchmark key: " + setup.task.benchmark);
    var task = { heading: setup.task.heading, label: taskOpt.label, line: taskOpt.line, peer: shown(tb) ? tb : null };
    var byId = {};
    bank.questions.forEach(function (q) { byId[q.id] = q; });
    var domainInfo = {};
    bank.domains.forEach(function (d) { domainInfo[d.key] = d; });

    // Domains in the order the setup lists their questions.
    var order = [], doms = {};
    active.forEach(function (id) {
      var q = byId[id];
      if (!q) throw new Error("Unknown question id: " + id);
      if (!doms[q.domain]) {
        doms[q.domain] = { key: q.domain, name: domainInfo[q.domain].name, points: 0, notSure: 0,
                           questions: [], next_step: q.next_step };
        order.push(q.domain);
      }
      var a = answers[id];
      if (!(a in scale.answers)) throw new Error("Missing answer: " + id);
      doms[q.domain].questions.push(q);
      if (scale.answers[a] === null) { doms[q.domain].na = (doms[q.domain].na || 0) + 1; return; } // Does not apply: left out.
      doms[q.domain].points += scale.answers[a]; // "Not sure" scores as None.
      if (a === "notsure") doms[q.domain].notSure++;
    });

    var domains = order.map(function (k) {
      var d = doms[k], n = d.questions.length - (d.na || 0);
      d.percent = n ? Math.round(d.points / n) : null;
      d.unknown = !n || d.notSure * 2 >= n;
      if (d.unknown) { d.level = null; d.label = d.percent === null ? "Does not apply" : scale.unknown_label; }
      else {
        d.level = scale.level_bands.filter(function (b) { return d.percent >= b.min; })[0].level;
        d.label = scale.levels[String(d.level)];
      }
      d.rank = scale.tie_order.indexOf(k);
      return d;
    });

    var scored = domains.filter(function (d) { return !d.unknown; });
    var average = null, tier = scale.unknown_tier;
    if (scored.length) {
      var sum = scored.reduce(function (s, d) { return s + d.level; }, 0);
      average = Math.round((sum / scored.length) * 10) / 10;
      tier = scale.tiers.filter(function (t) { return average >= t.min; })[0];
    }

    // 2 lowest scored domains by percent; ties follow the fixed tie order.
    var lowest = scored.slice().sort(function (a, b) {
      return (a.percent - b.percent) || (a.rank - b.rank);
    }).slice(0, 2);

    var plan = lowest.map(function (d) { return { domain: d.name, next_step: d.next_step }; });
    var rf = scale.review_first;
    if (rf.when.indexOf(answers[rf.question]) >= 0) plan.unshift({ domain: rf.domain, next_step: rf.next_step });

    var findOut = active.filter(function (id) { return answers[id] === "notsure"; })
      .map(function (id) { return setup.find_out_prefix + lowerFirst(byId[id].text); });
    if (count === "notsure") findOut.unshift(setup.count.notsure_find_out);

    // One peer line for each of the 2 lowest domains that has one, with a line that places the answer.
    var peers = lowest.filter(function (d) { return domainInfo[d.key].benchmark; }).map(function (d) {
      var b = scale.benchmarks[domainInfo[d.key].benchmark];
      if (!b) throw new Error("Unknown benchmark key: " + domainInfo[d.key].benchmark);
      var pl = b.place ? b.place.by_answer[answers[b.place.question]] : null;
      return Object.assign({}, b, { placement: ph(pl) ? null : pl });
    }).filter(shown);
    var top = setup.top_benchmarks.map(function (k) {
      if (!scale.benchmarks[k]) throw new Error("Unknown benchmark key: " + k);
      return scale.benchmarks[k];
    }).filter(shown);

    return { none: none, message: none ? setup.count.none_message : null, questions: active, task: task,
             headline: opt.headline, neutral: scale.neutral_line, average: average, tier: tier,
             domains: domains, plan: plan, findOut: findOut, peers: peers, top: top, offer: ph(scale.next_step_offer) ? null : scale.next_step_offer };
  }
  // HubSpot form body: the 4 contact fields, the result ID and 1 text summary. No free text beyond the contact.
  // Throws on a missing name or practice, a bad email or an answer outside the allowed values.
  var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function hubspotBody(setup, scale, result, answers, resultId, contact, meta) {
    contact = contact || {};
    ["firstname", "lastname", "company"].forEach(function (k) {
      if (!contact[k] || !String(contact[k]).trim()) throw new Error("Missing contact field: " + k);
    });
    if (!EMAIL.test(String(contact.email || "").trim())) throw new Error("Bad email");
    if (!/^[a-z0-9]{6,}$/.test(resultId)) throw new Error("Bad result ID");
    var counts = setup.count.options.map(function (o) { return o.value; });
    if (counts.indexOf(answers.COUNT) < 0) throw new Error("Bad count answer");
    var tasks = setup.task.options.map(function (o) { return o.value; });
    if (tasks.indexOf(answers.TASK) < 0) throw new Error("Bad task answer");
    var parts = ["time=" + meta.time, "build=" + meta.build, "count=" + answers.COUNT, "task=" + answers.TASK];

    return s;
  }
  function levelText(d) { return d.unknown ? d.label : d.percent + "%, Level " + d.level + " of 4, " + d.label; }

  function show(r, saved) {
    var out = document.getElementById("result");
    out.innerHTML = "";
    if (!saved) out.appendChild(el("p", "save-error", sc.contact.error));
    var avg = r.average === null ? "" : " (average level " + r.average.toFixed(1) + " of 4.0)";

    // 1. Cover
    var s1 = section(out);
    s1.className = "block cover";
    s1.appendChild(el("h2", null, sc.name + ": " + contact.company.trim()));
    s1.appendChild(el("p", null, new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })));
    var t = el("p", "tier");
    t.appendChild(document.createTextNode("Overall " + sc.level_name.toLowerCase() + ": "));
    t.appendChild(el("strong", null, r.tier.name));
    t.appendChild(document.createTextNode(avg));
    s1.appendChild(t);
    s1.appendChild(el("p", "neutral-cover", r.neutral));

    // 2. Summary
    var byKey = {};
    r.domains.forEach(function (d) { byKey[d.key] = d; });
    var s2 = section(out, "Summary");
    s2.appendChild(el("p", null, r.tier.explain));
    s2.appendChild(el("p", "decision", r.tier.decision));
    if (r.gaps.length) {
      s2.appendChild(el("h3", null, "Your " + r.gaps.length + " lowest domains"));
      var g = el("ol");
      r.gaps.forEach(function (k) { g.appendChild(el("li", null, byKey[k].name + ": " + levelText(byKey[k]))); });
      s2.appendChild(g);
    }
    s2.appendChild(el("p", "source", sc.level_note));

    // 3. Chart of the 8 levels
    var s3 = section(out, "Your 8 levels");
    r.domains.forEach(function (d) {
      var row = el("div", "domain-row");
      row.appendChild(el("span", "domain-name", d.key + " " + d.name));
      var bar = el("span", "bar");
      bar.setAttribute("aria-hidden", "true");
      for (var k = 1; k <= 4; k++) bar.appendChild(el("span", d.level && k <= d.level ? "seg on" : "seg"));
      row.appendChild(bar);
      row.appendChild(el("span", "domain-label", levelText(d) + (d.notSure ? " · Not sure: " + d.notSure : "")));
      s3.appendChild(row);
    });

    // 4. One block per domain: free and new findings together.
    var s4 = section(out, "Domain by domain");
    r.domains.forEach(function (d) {
      var b = el("div", "dblock");
      b.appendChild(el("h3", null, d.key + " " + d.name));
      b.appendChild(el("p", null, sc.level_name + ": " + levelText(d)));
      if (d.subLines) d.subLines.forEach(function (sl) { if (sl[1] !== null) b.appendChild(el("p", "sub", sl[0] + ": " + sl[1] + "%")); });
      else {
        if (d.fromFree !== null) b.appendChild(el("p", "sub", "From your free check: " + d.fromFree + "%"));
        if (d.fromNew !== null) b.appendChild(el("p", "sub", "From the ScoreCard statements: " + d.fromNew + "%"));
      }
      if (d.note) b.appendChild(el("p", "note", d.note));
      if (d.na) b.appendChild(el("p", "sub", "Scored on " + d.n + " statements. " + d.na + (d.na === 1 ? " does" : " do") + " not apply."));
      if (d.setupNa.length) {
        b.appendChild(el("p", "sub", sc.setup.na_label + ":"));
        var su = el("ul");
        d.setupNa.forEach(function (h) { su.appendChild(el("li", null, h)); });
        b.appendChild(su);
      }
      if (d.held.length) {
        b.appendChild(el("p", "sub", "Answered None:"));
        var ul = el("ul");
        d.held.forEach(function (h) { ul.appendChild(el("li", null, h)); });
        b.appendChild(ul);
      }
      if (!d.mainStale) {
        var m = el("p", "peer", d.main.line);
        m.appendChild(source(d.main));
        b.appendChild(m);
      }
      if (d.placement) b.appendChild(el("p", "placement", d.placement));
      if (d.context) { var c = el("p", "peer", d.context.line); c.appendChild(source(d.context)); b.appendChild(c); }
      if (d.number) b.appendChild(el("p", null, "Your number (the Assessment uses it): " + d.number.label + " " + d.number.value));
      b.appendChild(el("p", null, "Next step: " + d.next_step));
      s4.appendChild(b);
    });

    // 5. Find-out list
    if (r.findOut.length) {
      var s5 = section(out, "Find out");
      var fl = el("ul");
      r.findOut.forEach(function (f) { fl.appendChild(el("li", null, f)); });
      s5.appendChild(fl);
    }

    // 6. 90-day plan
    var s6 = section(out, "Your 90-day plan");
    var pl = el("ol");
    r.plan.forEach(function (p) {
      var li = el("li");
      li.appendChild(el("strong", null, p.domain + ": "));
      li.appendChild(document.createTextNode(p.next_step));
      pl.appendChild(li);
    });
    s6.appendChild(pl);

    // 7. What the Assessment measures next
    var s7 = section(out, "What the Assessment measures next");
    var al = el("ul");
    r.plan.filter(function (p) { return p.assess_next; }).forEach(function (p) {
      var li = el("li");
      li.appendChild(el("strong", null, p.domain + ": "));
      li.appendChild(document.createTextNode(p.assess_next));
      al.appendChild(li);
    });
    s7.appendChild(al);
    s7.appendChild(el("p", "neutral", r.neutral));

    // 8. Sources
    var s8 = section(out, "Sources");
    var srcs = el("ul"), seen = {};
    if (r.pollNote) s8.appendChild(el("p", "source", r.pollNote));
    r.domains.forEach(function (d) {
      [d.mainStale ? null : d.main, d.context].forEach(function (b) {
        if (!b || seen[b.url]) return;
        seen[b.url] = true;
        var li = el("li", null, b.source + ", " + b.date + (b.n ? ", " + b.n.toLocaleString("en-US") + " responses" : "") + ": ");
        var a = el("a", null, b.url);
        a.href = b.url; a.target = "_blank"; a.rel = "noopener";
        li.appendChild(a);
        srcs.appendChild(li);
      });
    });
    s8.appendChild(srcs);

    var pr = el("button", "print", "Save as PDF");
    pr.type = "button";
    pr.addEventListener("click", function () { window.print(); });
    out.appendChild(pr);
    document.getElementById("questions").hidden = true;
    out.hidden = false;
    out.scrollIntoView({ behavior: "smooth" });
  }
})();
</script>
</body>
</html>
